<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — CampaignDesk</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
    }
    .badge {
      display: inline-block;
      background: #1e2a3a;
      color: #60a5fa;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    h1 { color: #f0f0f0; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 36px; }
    .field { margin-bottom: 18px; }
    label { display: block; color: #9ca3af; font-size: 12px; font-weight: 500;
            letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
    input { width: 100%; background: #0f1117; border: 1px solid #2a2d3a;
            border-radius: 8px; color: #f0f0f0; font-size: 15px;
            padding: 12px 14px; outline: none; transition: border-color 0.15s; }
    input:focus { border-color: #3b82f6; }
    .error { background: #2d1a1a; border: 1px solid #7f1d1d; border-radius: 8px;
             color: #fca5a5; font-size: 13px; padding: 12px 14px; margin-bottom: 20px; }
    button { width: 100%; background: #3b82f6; border: none; border-radius: 8px;
             color: #fff; font-size: 15px; font-weight: 600; padding: 13px;
             cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    button:hover { background: #2563eb; }
    .footer { text-align: center; color: #374151; font-size: 12px; margin-top: 32px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Super Admin</div>
    <h1>CampaignDesk</h1>
    <p class="sub">Platform administration</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
    <div class="footer">CampaignDesk &nbsp;·&nbsp; SquareRoot Inc</div>
  </div>
</body>
</html>
