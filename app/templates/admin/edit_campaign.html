{% extends 'admin/base.html' %}
{% block page_title %}Edit campaign{% endblock %}
{% block content %}
<div style="max-width:720px">
  <div class="card">
    <div class="card-title">✏ Edit · {{ campaign.candidate_name }}</div>
    <form method="POST">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Candidate name</label><input type="text" name="candidate_name" value="{{ campaign.candidate_name }}" required></div>
        <div class="form-group"><label class="form-label">Party</label>
          <select name="party">
            {% for p in ['ODM','UDA','Jubilee','ANC','Wiper','KANU','Independent'] %}
            <option value="{{ p }}" {{ 'selected' if campaign.party==p }}>{{ p }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Seat level</label>
          <select name="seat_level">
            {% for s in ['MCA','MP','Senator','Governor','WomRep'] %}
            <option value="{{ s }}" {{ 'selected' if campaign.seat_level==s }}>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group"><label class="form-label">County</label><input type="text" name="county" value="{{ campaign.county }}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Constituency</label><input type="text" name="constituency" value="{{ campaign.constituency or '' }}"></div>
        <div class="form-group"><label class="form-label">Ward</label><input type="text" name="ward" value="{{ campaign.ward or '' }}"></div>
      </div>
      <div class="form-group">
        <label class="form-label">IEBC Constituency code</label>
        <input type="text" name="constituency_code" value="{{ campaign.constituency_code or '' }}" placeholder="3-digit code e.g. 290">
      </div>
      <div class="form-group"><label class="form-label">Slogan</label><input type="text" name="slogan" value="{{ campaign.slogan or '' }}"></div>
      <div class="form-group"><label class="form-label">Bio</label><textarea name="bio" rows="4">{{ campaign.bio or '' }}</textarea></div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{{ url_for('admin.campaigns') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
