<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · CampaignDesk</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .card{background:#161b22;border:1px solid #2d3d50;border-radius:14px;padding:40px;width:100%;max-width:380px}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .logomark{width:28px;height:28px;border-radius:8px;background:#e8a838;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#131c27}
    .logo-text{font-size:15px;font-weight:600;color:#f0f4f8}
    .logo-badge{font-size:10px;background:#dc2626;color:#fff;padding:2px 7px;border-radius:20px;font-weight:700;text-transform:uppercase}
    h1{color:#f0f4f8;font-size:20px;font-weight:700;margin-bottom:6px}
    p{color:#64748b;font-size:13px;margin-bottom:28px}
    .field{margin-bottom:16px}
    label{display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    input{width:100%;background:#0d1117;border:1px solid #2d3d50;border-radius:7px;color:#f0f4f8;font-size:14px;padding:10px 12px;outline:none;transition:border-color .15s}
    input:focus{border-color:#e8a838}
    .error{background:#1f1010;border:1px solid #5a1d1d;border-radius:7px;color:#fca5a5;font-size:13px;padding:10px 12px;margin-bottom:16px}
    button{width:100%;background:#e8a838;color:#131c27;border:none;border-radius:7px;font-size:14px;font-weight:700;padding:12px;cursor:pointer;margin-top:6px;transition:opacity .15s}
    button:hover{opacity:.88}
    .footer{text-align:center;color:#2d3d50;font-size:11px;margin-top:24px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logomark">CD</div>
      <span class="logo-text">CampaignDesk</span>
      <span class="logo-badge">Admin</span>
    </div>
    <h1>Platform admin</h1>
    <p>Sign in to manage campaigns and billing</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" required autofocus placeholder="you@squarerootinc.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit">Sign in to admin panel</button>
    </form>
    <div class="footer">CampaignDesk · SquareRoot Inc</div>
  </div>
</body>
</html>
