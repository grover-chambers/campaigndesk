{% extends 'admin/base.html' %}
{% block page_title %}Create campaign{% endblock %}
{% block content %}
<div style="max-width:720px">
  <div class="card">
    <div class="card-title">📋 New campaign details</div>
    <form method="POST" id="campaign-form">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Candidate full name</label>
          <input type="text" name="candidate_name" required placeholder="e.g. Julius Were">
        </div>
        <div class="form-group">
          <label class="form-label">Party</label>
          <select name="party">
            {% for p in ['ODM','UDA','Jubilee','ANC','Wiper','KANU','Independent'] %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Seat level</label>
          <select name="seat_level" id="seat-level" onchange="updateSeatLevel()">
            {% for s in ['MCA','MP','Senator','Governor','WomRep'] %}
            <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tier</label>
          <select name="tier">
            <option value="starter">Starter — Ksh 2,500/mo</option>
            <option value="constituency">Constituency — Ksh 8,000/mo</option>
            <option value="county">County — Custom</option>
          </select>
        </div>
      </div>

      <!-- Location cascades -->
      <div class="form-row-3">
        <div class="form-group">
          <label class="form-label">County</label>
          <select name="county" id="county-sel" onchange="loadConstituencies()" required>
            <option value="">Select county…</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Constituency</label>
          <select name="constituency" id="constituency-sel" onchange="loadWards();autoFillCode()" required>
            <option value="">Select constituency…</option>
          </select>
        </div>
        <div class="form-group" id="ward-group">
          <label class="form-label">Ward <span style="color:var(--muted);font-weight:400">(MCA only)</span></label>
          <select name="ward" id="ward-sel">
            <option value="">Select ward…</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          IEBC Constituency code
          <span style="color:var(--muted);font-weight:400;text-transform:none;font-size:10px"> — auto-filled from constituency</span>
        </label>
        <input type="text" name="constituency_code" id="const-code"
               placeholder="Auto-filled when you select constituency">
      </div>

      <div class="form-group">
        <label class="form-label">Campaign slogan</label>
        <input type="text" name="slogan" placeholder="e.g. Pamoja Tunajenga Embakasi">
      </div>
      <div class="form-group">
        <label class="form-label">Candidate bio</label>
        <textarea name="bio" rows="3"
          placeholder="Short paragraph about the candidate — background, experience, vision."></textarea>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:4px">
        <div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;
                    letter-spacing:.06em;margin-bottom:12px">Campaign secretary</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Secretary full name</label>
            <input type="text" name="secretary_name" required placeholder="e.g. Jane Muthoni">
          </div>
          <div class="form-group">
            <label class="form-label">Secretary phone</label>
            <input type="text" name="secretary_phone" required placeholder="07xx xxxxxx">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Trial period (days)</label>
        <input type="number" name="trial_days" value="30" min="1" max="365">
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button type="submit" class="btn btn-primary">Create campaign</button>
        <a href="{{ url_for('admin.campaigns') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
let locationData = {}
let iebcCodes    = {}

// Load all data on page load
Promise.all([
  fetch('/api/locations').then(r => r.json()),
  fetch('/api/iebc-codes').then(r => r.json())
]).then(([locs, codes]) => {
  locationData = locs
  iebcCodes    = codes

  // Populate counties
  const sel = document.getElementById('county-sel')
  Object.keys(locs).sort().forEach(county => {
    const opt = document.createElement('option')
    opt.value = county
    opt.textContent = county
    sel.appendChild(opt)
  })
})

function loadConstituencies() {
  const county = document.getElementById('county-sel').value
  const cSel   = document.getElementById('constituency-sel')
  const wSel   = document.getElementById('ward-sel')

  cSel.innerHTML = '<option value="">Select constituency…</option>'
  wSel.innerHTML = '<option value="">Select ward…</option>'
  document.getElementById('const-code').value = ''

  if(!county || !locationData[county]) return

  Object.keys(locationData[county]).sort().forEach(c => {
    const opt = document.createElement('option')
    opt.value = c
    opt.textContent = c
    cSel.appendChild(opt)
  })
}

function loadWards() {
  const county = document.getElementById('county-sel').value
  const const_ = document.getElementById('constituency-sel').value
  const wSel   = document.getElementById('ward-sel')

  wSel.innerHTML = '<option value="">Select ward…</option>'
  if(!county || !const_ || !locationData[county] || !locationData[county][const_]) return

  locationData[county][const_].forEach(w => {
    const opt = document.createElement('option')
    opt.value = w
    opt.textContent = w
    wSel.appendChild(opt)
  })
}

function autoFillCode() {
  const const_ = document.getElementById('constituency-sel').value
  const codeEl = document.getElementById('const-code')
  if(!const_) return

  // Try exact match first (IEBC uses uppercase)
  const upper = const_.toUpperCase().trim()
  if(iebcCodes[upper]) {
    codeEl.value = iebcCodes[upper]
    return
  }
  // Try partial match
  for(const [name, code] of Object.entries(iebcCodes)) {
    if(name.includes(upper) || upper.includes(name)) {
      codeEl.value = code
      return
    }
  }
  codeEl.value = ''
  codeEl.placeholder = 'Not found — enter manually'
}

function updateSeatLevel() {
  const level = document.getElementById('seat-level').value
  const wg    = document.getElementById('ward-group')
  // Show ward only for MCA
  wg.style.opacity = level === 'MCA' ? '1' : '0.4'
}

// Init
updateSeatLevel()
</script>
{% endblock %}
